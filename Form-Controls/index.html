<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Form Controls</title>  
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <!-- Requirement 1: Use semantic HTML elements to structure the form. -->
      <form>
         <label for="first-name">First Name:</label>
         <input type="text" id="first-name" name="first-name" minlength="2" required> <br><br>
         <label for="last-name">Last Name:</label>
         <input type="text" id="last-name" name="last-name" minlength="2" required> <br><br> 

        <!-- Requirement 2: Every input has an associated label -->

      <label for="Email">Email:</label>
      <input type="email" id="Email" placeholder="Email address" required> <br><br>
      
        <!-- Requirement 3: The email field is required and uses HTML email validation -->

       <fieldset>
        <legend>Choose a colour:</legend>
        <label> <input type="radio" name="colour" value="red" required> Red </label>
        <label> <input type="radio" name="colour" value="black"> Black </label>
        <label> <input type="radio" name="colour" value="blue"> Blue </label>
      </fieldset> <br>

        <!-- Requirement 4:Radio buttons allow the user to select one of three colours -->

     <label for="size">Choose your T-shirt size:</label>
     
     <select id="size" name="size" required> 
        <option>Select a size</option>
        <option value="XS">Extra small (XS)</option>
        <option value="S">Small (S)</option>
        <option value="M">Medium (M)</option>
        <option value="L">Large (L)</option>
        <option value="XL">Extra Large (XL)</option>
        <option value="XLL">Double Extra Large (XXL)</option>
     </select> <br><br>

       <!-- Requirement 5:The select and option tags allow the user to choose one size from given drop down options -->

     <button type="submit">Submit</button>
      
      </form>
    </main>
    <footer>
      <!-- Vidhi Pandya -->
      <h2>© 2026 T-Shirt Store. All rights reserved.</h2>
    </footer>
  </body>
</html>
